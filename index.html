<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>บันทึกข้อมูลลง Google Sheet</title>
</head>
<body>
  <h2>แบบฟอร์ม</h2>
  <input type="text" id="name" placeholder="ชื่อ"><br>
  <input type="email" id="email" placeholder="อีเมล"><br>
  <input type="text" id="phone" placeholder="เบอร์โทร"><br>
  <button onclick="submitData()">บันทึก</button>

  <script>
    async function submitData() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;

      const payload = {
        name: name,
        email: email,
        phone: phone
      };

      const response = await fetch("https://script.google.com/macros/s/AKfycbz_1WUy7fmGMaBZiDQfGuzDTaV3QwUu7thGUnCR7u4glgH2WG04btSFF463aoBdEfATTg/exec", {
        method: "POST",
        body: JSON.stringify(payload),
        headers: {
          "Content-Type": "application/json"
        }
      });

      const result = await response.text();
      alert(result);
    }
  </script>
</body>
</html>
